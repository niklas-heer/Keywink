[tasks.build]
description = "Build the Keywink app without code signing"
run = '''
xcodebuild build \
  -project "Keywink.xcodeproj" \
  -scheme "Keywink" \
  -configuration Debug \
  -destination "platform=macOS" \
  -derivedDataPath build \
  CODE_SIGNING_ALLOWED=NO
'''

[tasks.test]
description = "Run the isolated Keywink test suite"
run = '''
xcodebuild test \
  -project "Keywink.xcodeproj" \
  -scheme "Keywink" \
  -destination "platform=macOS" \
  -testPlan "TestPlan" \
  -derivedDataPath build \
  -maximum-test-execution-time-allowance 120 \
  CODE_SIGNING_ALLOWED=NO
'''

[tasks.snapshots]
description = "Render every Settings pane to build/snapshots/pane-*.png for review"
run = '''
TEST_RUNNER_KEYWINK_SNAPSHOT_DIR="$PWD/build/snapshots" xcodebuild test \
  -project "Keywink.xcodeproj" \
  -scheme "Keywink" \
  -destination "platform=macOS" \
  -testPlan "TestPlan" \
  -derivedDataPath build \
  -only-testing:KeywinkTests/SettingsPaneSnapshotTests \
  CODE_SIGNING_ALLOWED=NO \
  && ls build/snapshots
'''

[tasks.format]
description = "Format Swift sources in place"
run = '''
xcrun swift-format format --in-place --recursive \
  "Keywink" \
  "KeywinkTests"
'''

[tasks.lint]
description = "Check Swift formatting"
run = '''
xcrun swift-format lint --strict --recursive \
  "Keywink" \
  "KeywinkTests"
'''

[tasks.scripts]
description = "Check release-script syntax"
run = "bash -n bin/archive bin/bump bin/release bin/release-adhoc"

[tasks.check]
description = "Run formatting, script checks, and the native test suite"
depends = ["lint", "scripts", "test"]

[tasks.archive]
description = "Create a Developer ID archive (requires signing environment)"
run = "bin/archive"

[tasks.release]
description = "Export, notarize, and package a local GitHub release artifact"
run = "bin/release"

[tasks.release-adhoc]
description = "Package an ad-hoc signed, non-notarized build (interim, until Developer ID signing is available)"
run = "bin/release-adhoc"
